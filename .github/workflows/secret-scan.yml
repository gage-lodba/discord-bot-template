name: Secret scan

# Full-history secret scan for this repository.
#
# CI scans the entire git history on every push to main, every pull request and
# manual dispatch. The scan has no baseline (the only allowlist entry keeps the
# committed Cargo.lock content out of the matching): a red result means a *new*
# secret has been committed, and the fix is to rotate it and purge it from
# history rather than to silence the scan.
#
# The Discord bot-token rule that the upstream default ruleset does not reliably
# cover lives in .gitleaks.toml.
#
# The gitleaks OSS CLI is driven directly rather than gitleaks-action because
# the action requires a paid GITLEAKS_LICENSE for organisation-owned
# repositories, while the CLI needs no licence.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan for committed secrets
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          # Full history: a secret that was removed from the working tree but is
          # still in an old commit must still fail the scan.
          fetch-depth: 0

      - name: Install gitleaks
        env:
          # Pinned deliberately. Resolving "latest" from the GitHub API was
          # unauthenticated, and shared runner IPs exhaust the 60/hour limit, so
          # a rate-limited response produced an empty version and a confusing
          # 404 on the download. A pinned version also stops the CLI and the
          # config contract from drifting under this job. Bump deliberately,
          # checking .gitleaks.toml against the release notes.
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          echo "Installing gitleaks ${GITLEAKS_VERSION}"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks version

      - name: Scan full history
        run: |
          set -euo pipefail
          ./gitleaks git --redact --verbose --exit-code 1 .
