# Pin the toolchain so local builds and CI agree.
#
# Without this, CI's `rustup update stable` installs whatever stable happens to
# be current. That is how the lint job silently turned red: Rust 1.98.0 added
# `clippy::result_large_err` reports for large `Result` error types, and the
# `-D warnings` flag promoted them to errors. Bump this deliberately.
[toolchain]
channel = "1.98.0"
components = ["rustfmt", "clippy"]
profile = "minimal"
